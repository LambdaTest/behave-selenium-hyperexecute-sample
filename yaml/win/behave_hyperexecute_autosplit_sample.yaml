---
version: 0.1

globalTimeout: 90
testSuiteTimeout: 90
testSuiteStep: 90

runson: win

runtime:
  language: python
  version: "3.11"

autosplit: true
retryOnFailure: true

maxRetries: 1
concurrency: 2

env:
  # PAT: ${{ .secrets.testKey }}
  TARGET_OS: Windows 10

cacheKey: '{{ checksum "requirements.txt" }}'

cacheDirectories:
  - pip_cache

pre:
  - python -m pip install --upgrade pip
  - python -m pip install -r requirements.txt --cache-dir pip_cache

post:
  - type yaml\win\behave_hyperexecute_autosplit_sample.yaml

upload:
  - reports/test_report.json

mergeArtifacts: true

uploadArtefacts:
  - name: TestReports
    path:
      - reports/**

report: true

partialReports:
  type: json
  location: /
  frameworkName: extent

testDiscovery:
  type: raw
  mode: remote
  command: grep -nri 'Feature' features -ir --include=\*.feature | sed 's/:.*//'

testRunnerCommand: python -m behave -f json.pretty -o reports/test_report.json $test

jobLabel:
  - selenium-behave
  - win
  - autosplit