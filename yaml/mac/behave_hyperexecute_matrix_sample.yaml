---
version: 0.1

globalTimeout: 90
testSuiteTimeout: 90
testSuiteStep: 90

matrix:
  files:
    - features/lt_todo_app.feature
    - features/lt_selenium_playground.feature

runson: mac

runtime:
  language: python
  version: "3.11"

retryOnFailure: true
maxRetries: 1

env:
  # PAT: ${{ .secrets.testKey }}
  TARGET_OS: MacOS Catalina

cacheKey: '{{ checksum "requirements.txt" }}'

cacheDirectories:
  - pip_cache

pre:
  - python3 -m pip install --upgrade pip
  - python3 -m pip install -r requirements.txt --cache-dir pip_cache

post:
  - cat yaml/mac/behave_hyperexecute_matrix_sample.yaml

mergeArtifacts: true

uploadArtefacts:
  - name: TestReports
    path:
      - reports/**

report: true

partialReports:
  type: json
  location: /
  frameworkName: extent

testSuites:
  - python3 -m behave -f json.pretty -o reports/test_report.json $files

jobLabel:
  - selenium-behave
  - mac
  - matrix